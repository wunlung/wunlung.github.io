---
layout: default
---
<article class="post note">
  <header class="post-header">
    <p class="eyebrow">Note · {{ page.date | date: "%B %-d, %Y" }}</p>
    <h1>{{ page.title }}</h1>
    {% if page.description %}<p class="post-description">{{ page.description }}</p>{% endif %}
  </header>
  <div class="post-content">{{ content }}</div>
  <div class="post-end">∎</div>
  <a class="back-link" href="{{ '/notes/' | relative_url }}">← All notes</a>
</article>
